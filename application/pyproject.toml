[project]
name = "usterka"
version = "0.1.0"
description = "Usterki na planie - API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered --cov-fail-under=100"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["."]
branch = true
omit = ["manage.py", "*/migrations/*", "tests/*", "conftest.py", ".venv/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "B008"]  # B008: Form()/File() w sygnaturach to idiom django-ninja

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311", "E501"]  # hasła i długie linie w danych testowych jawnie dozwolone

name: CI/CD

on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }

permissions: { contents: read }

# Nowy push do tej samej gałęzi anuluje trwający przebieg (oszczędza minuty, nie wdraża starych zmian)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (ruff, migracje, pytest 100%)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: application } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: application/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migracje są zgodne z modelami
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - name: Testy (pokrycie instrukcji i gałęzi musi wynosić 100%)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-backend, path: application/coverage.xml, if-no-files-found: ignore }

  frontend:
    name: Frontend (typy, vitest, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: usterka_frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: usterka_frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Obrazy produkcyjne (build bez publikacji)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfiguracja Compose jest poprawna i obrazy się budują
        run: |
          printf 'DOMAIN=ci.example\nPOSTGRES_PASSWORD=ci\nDJANGO_SECRET_KEY=ci\n' > .env
          docker compose -f deploy/docker-compose.prod.yml --env-file .env config -q
          docker compose -f deploy/docker-compose.prod.yml --env-file .env build

  audit:
    name: Audyt zależności (informacyjnie)
    runs-on: ubuntu-latest
    continue-on-error: true   # nowe CVE w zależnościach nie powinny blokować wdrożenia poprawki, ale mają być widoczne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit && pip-audit -r application/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: usterka_frontend

  deploy:
    name: Wdrożenie na VPS
    needs: [backend, frontend, docker]
    # Włączane zmienną repozytorium DEPLOY_ENABLED=true (po dodaniu sekretów, patrz docs/08-ci-cd.md)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://usterka.axword.pl
    steps:
      - name: Skonfiguruj SSH (klucz tylko do uruchamiania skryptu wdrożenia)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
      - name: Uruchom wdrożenie
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
      - name: Test dymny po wdrożeniu
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://usterka.axword.pl/api/billing/plans || true)
            [ "$code" = "200" ] && echo "OK ($code)" && exit 0
            sleep 5
          done
          echo "Strona nie odpowiada poprawnie po wdrożeniu" && exit 1

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usterki na planie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --ink:#17202B; --muted:#5B6672; --line:#CDD2CB;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --open:#C8102E; --fixed:#1E7B4A; --tape:#F2C230;
  --vbg:#D9DDD6; --field:#F7F8F5; --danger:#B3261E; --shadow:0 1px 0 rgba(23,32,43,.08);
  --sans:"Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171D; --surface:#1B222B; --ink:#E8ECEF; --muted:#9AA5B1; --line:#2D3742;
    --accent:#6FA3E8; --accent-ink:#0E1620; --open:#FF5A6E; --fixed:#4CC38A;
    --vbg:#0C1015; --field:#151B22; --danger:#FF7A70; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1B222B; --ink:#E8ECEF; --muted:#9AA5B1; --line:#2D3742;
  --accent:#6FA3E8; --accent-ink:#0E1620; --open:#FF5A6E; --fixed:#4CC38A;
  --vbg:#0C1015; --field:#151B22; --danger:#FF7A70; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);min-height:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-t{flex:1;margin:0;font:700 22px/1.1 var(--cond);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{margin:0;font:700 26px/1 var(--cond);letter-spacing:.01em;flex:1}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.h1{font:700 30px/1.08 var(--cond);margin:4px 0 4px}
.h2{font:600 22px/1.15 var(--cond);margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
.h2 .n{font:500 15px var(--sans);color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap} .row.end{justify-content:flex-end}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 16px;font-weight:600;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.small{min-height:38px;padding:7px 12px;font-size:15px}
.btn.block{display:flex;width:100%;margin-top:12px}
.demo{border:2px solid #17202B;background:var(--tape);color:#17202B;border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px;line-height:1.35;margin:0 0 16px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;margin:0;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{appearance:none;border:0;background:transparent;color:var(--ink);width:44px;height:44px;border-radius:10px;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.back{appearance:none;border:0;background:transparent;color:var(--accent);font-weight:600;padding:8px 6px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px}

/* home */
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px 18px;margin:8px 0 4px}
.empty-t{font:600 22px/1.2 var(--cond);margin:0 0 4px}
.empty p{margin:0}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 14px 12px;cursor:pointer;display:grid;gap:3px;box-shadow:var(--shadow)}
.card-t{font:600 21px/1.15 var(--cond)}
.card-s{color:var(--muted);font-size:15px}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cnt{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.cnt.open{color:var(--open)} .cnt.fixed{color:var(--fixed)}
.backup{margin-top:36px;border-top:1px solid var(--line);padding-top:4px}
.backup p{margin:0 0 10px}

/* project */
.data{display:grid;grid-template-columns:minmax(110px,38%) 1fr;margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.data dt,.data dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.data dt{color:var(--muted);font-size:14px;font-weight:500}
.data dd{font-weight:500;overflow-wrap:anywhere}
.data dt:first-of-type,.data dd:first-of-type{border-top:0}
.plans{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plan{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.plan-open{appearance:none;border:0;background:none;display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;cursor:pointer;padding:0}
.plan img{width:76px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff;flex:none}
.plan-t{font:600 19px/1.15 var(--cond);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dlist li+li{border-top:1px solid var(--line)}
.ditem{appearance:none;border:0;background:none;width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 12px;cursor:pointer}
.ditem .txt{min-width:0;flex:1}
.ditem .ty{font-weight:600}
.ditem .ds{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:15px 15px 15px 3px;display:grid;place-items:center;color:#fff;font:700 16px/1 var(--cond);background:var(--open)}
.badge.fixed{background:var(--fixed)}
.note{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0 0}

/* plan viewer */
.vscreen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--vbg);z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.vtitle{flex:1;min-width:0;display:grid}
.vt{font:700 20px/1.1 var(--cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.viewer.adding{cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{display:block;width:100%;height:100%;max-width:none;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);-webkit-user-drag:none;pointer-events:none}
.pins{position:absolute;inset:0}
.pin{position:absolute;width:36px;height:46px;margin:0;padding:0;border:0;background:none;transform-origin:50% 100%;cursor:pointer}
.pin svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.pin .b{fill:var(--open)} .pin.fixed .b{fill:var(--fixed)}
.pin text{font:700 15px var(--cond);fill:#fff}
.pin.hl svg{animation:bob .9s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.pin.hl svg{animation:none}}
.vtools{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.vtools .legend{flex:1;display:flex;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.vtools.mode{flex-direction:column;align-items:stretch;padding:0 0 10px;gap:0;background:var(--tape);color:#17202B}
.tape{height:12px;background:repeating-linear-gradient(-45deg,#F2C230 0 12px,#17202B 12px 24px)}
.mode-row{display:flex;align-items:center;gap:10px;padding:10px 12px 0}
.mode-t{flex:1;font:700 20px/1.15 var(--cond)}
.vtools.mode .btn{background:#17202B;color:#F2C230;border-color:#17202B}

/* sheets & forms */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .bar{top:0}
.field{display:block;margin:0 0 18px}
.lbl{display:block;font-weight:600;margin:0 0 6px}
.req{color:var(--open)}
.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px}
textarea.inp{resize:vertical;min-height:110px}
.inp:focus{border-color:var(--accent);outline:none}
.inp.bad,.chips.bad,.seg.bad{box-shadow:0 0 0 2px var(--open);border-radius:10px}
.ferr{color:var(--open);font-size:14px;margin-top:4px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-height:42px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{appearance:none;border:0;background:none;padding:10px 6px;min-height:46px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mt{margin-top:8px}
.crop{display:block;width:100%;aspect-ratio:4/3;background:#fff;border:1px solid var(--line);border-radius:10px}
.range{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:14px;color:var(--muted)}
.range input{flex:1;accent-color:var(--accent);min-height:36px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:0 0 10px}
.photos:empty{display:none}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--field)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(15,20,26,.75);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.fixbox{border-left:4px solid var(--fixed);padding-left:12px}
.fixbox.on .lbl{color:var(--fixed)}
.formerr{color:var(--open);font-weight:600;margin:0 0 6px}
.logo-prev{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo-prev img{max-height:56px;max-width:160px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* modal, busy, toast, lightbox */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(10,14,18,.55);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font:700 22px/1.15 var(--cond)}
.modal p{margin:0 0 14px;color:var(--muted);overflow-wrap:anywhere}
.modal .inp{margin-bottom:14px}
.busy{position:fixed;inset:0;z-index:90;background:rgba(10,14,18,.6);display:grid;place-items:center;color:#fff;font:600 20px var(--cond);text-align:center;padding:24px}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:var(--tape);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lightbox{position:fixed;inset:0;z-index:85;background:#0A0D10;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .iconbtn{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;color:#fff;background:rgba(255,255,255,.12)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pagebtn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:grid;gap:6px;font-weight:600}
.pagebtn canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);min-height:80px}
.progress{font-weight:600;color:var(--muted);margin-top:10px;min-height:1.4em}
</style>
</head>

<script>
'use strict';
/* ---------- utils ---------- */
const TYPES=['Budowlana','Sanitarna','Elektryczna','Instalacje budynkowe','Meble/wyposażenie','Inna'];
const COL={open:'#C8102E',fixed:'#1E7B4A'};
const app=document.getElementById('app');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}.${m}.${y}`};
const isFixed=d=>!!(d.after&&d.after.length);
const typeLabel=d=>d.type==='Inna'&&d.typeOther?`Inna (${d.typeOther})`:d.type;
const dueLabel=d=>d.dueMode==='umowa'?'Zgodnie z umową':fmtDate(d.dueDate);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  cam:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/></svg>'
};
const pinSVG=no=>`<svg viewBox="0 0 36 46"><path class="b" d="M18 45 C14 37 4 30 4 18 A14 14 0 1 1 32 18 C32 30 22 37 18 45Z" stroke="#fff" stroke-width="2.5"/><text x="18" y="23.5" text-anchor="middle">${no}</text></svg>`;

function toast(msg,ms=3200){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
let busyEl=null;
function busy(text){hideBusy();busyEl=document.createElement('div');busyEl.className='busy';busyEl.innerHTML=`<div><div class="spin"></div><div class="bt">${esc(text)}</div></div>`;document.body.appendChild(busyEl)}
function busyText(t){if(busyEl)busyEl.querySelector('.bt').textContent=t}
function hideBusy(){if(busyEl){busyEl.remove();busyEl=null}}
function dialog({title,text,input,okLabel='OK',cancelLabel='Anuluj',danger=false}){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='modal-back';
    el.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${input!==undefined?`<input class="inp" value="${esc(input)}">`:''}<div class="row end">${cancelLabel?`<button class="btn" data-r="0">${esc(cancelLabel)}</button>`:''}<button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(el);
    const inp=el.querySelector('input');if(inp){inp.focus();inp.select()}else el.querySelector('[data-r="1"]').focus();
    el.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const ok=b.dataset.r==='1';el.remove();res(ok?(inp?inp.value.trim():true):(inp?null:false))});
    inp&&inp.addEventListener('keydown',e=>{if(e.key==='Enter'){el.remove();res(inp.value.trim())}});
  });
}
function lightbox(src){const el=document.createElement('div');el.className='lightbox';el.innerHTML=`<img src="${src}" alt=""><button class="iconbtn" aria-label="Zamknij">${ICON.close}</button>`;el.addEventListener('click',()=>el.remove());document.body.appendChild(el)}
function pickFiles({accept,multiple=false,capture=null}){
  return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;if(multiple)i.multiple=true;if(capture)i.setAttribute('capture',capture);i.style.display='none';document.body.appendChild(i);
    i.addEventListener('change',()=>{res([...i.files]);i.remove()});i.addEventListener('cancel',()=>{res([]);i.remove()});i.click();});
}

/* ---------- storage (IndexedDB, only on this device) ---------- */
let dbp=null;
function openDB(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('Brak IndexedDB'));const r=indexedDB.open('usterki-na-planie',2);
  r.onupgradeneeded=()=>{const d=r.result;for(const s of ['projects','plans','defects','blobs','meta'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function tx(store,mode,fn){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Przerwano zapis'))})}
const dbGet=(s,id)=>tx(s,'readonly',st=>st.get(id));
const dbAll=s=>tx(s,'readonly',st=>st.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const dbDel=(s,id)=>tx(s,'readwrite',st=>st.delete(id));
async function putBlob(blob,id=uid()){const buf=await blob.arrayBuffer();await dbPut('blobs',{id,type:blob.type||'image/jpeg',buf});return id}
async function getBlob(id){const r=await dbGet('blobs',id);return r?new Blob([r.buf],{type:r.type}):null}
const urlCache=new Map();
async function blobURL(id){if(urlCache.has(id))return urlCache.get(id);const b=await getBlob(id);if(!b)return '';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
async function delBlob(id){if(!id)return;await dbDel('blobs',id);const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}imgCache.delete(id)}
const imgCache=new Map();
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Nie można odczytać obrazu'));i.src=src})}
async function planImage(plan){if(imgCache.has(plan.imageId))return imgCache.get(plan.imageId);const i=await loadImg(await blobURL(plan.imageId));imgCache.set(plan.imageId,i);return i}
async function touchProject(id){const p=await dbGet('projects',id);if(p){p.updatedAt=Date.now();await dbPut('projects',p)}}

/* ---------- images ---------- */
async function fileToImage(file){const u=URL.createObjectURL(file);try{return await loadImg(u)}finally{URL.revokeObjectURL(u)}}
function canvasToBlob(c,type='image/jpeg',q=.85){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Błąd przetwarzania obrazu')),type,q))}
async function resizeImage(img,maxSide,q,type='image/jpeg',maxArea=12e6){
  const w=img.naturalWidth,h=img.naturalHeight;let k=Math.min(1,maxSide/Math.max(w,h));if(w*h*k*k>maxArea)k=Math.sqrt(maxArea/(w*h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');
  if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);
  const blob=await canvasToBlob(c,type,q);const out={blob,w:c.width,h:c.height};c.width=c.height=0;return out}
function drawPin(ctx,x,y,r,no,fixed,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;const cy=y-r*1.75;
  const path=()=>{ctx.beginPath();ctx.arc(x,cy,r,0,Math.PI*2);ctx.moveTo(x-r*.55,cy+r*.83);ctx.lineTo(x,y);ctx.lineTo(x+r*.55,cy+r*.83);ctx.closePath()};
  path();ctx.strokeStyle='#fff';ctx.lineWidth=r*.34;ctx.lineJoin='round';ctx.stroke();
  path();ctx.fillStyle=fixed?COL.fixed:COL.open;ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(r*(String(no).length>2?0.95:1.2))}px "Barlow Condensed", Arial, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(no),x,cy+r*.06);
  ctx.restore();
}
/* crop of plan around a defect; zoom = crop width as fraction of the plan's longer side */
function renderCrop(img,d,others,canvas,W=1200,H=900){
  const iw=img.naturalWidth,ih=img.naturalHeight,L=Math.max(iw,ih);
  let cw=(d.zoom||.3)*L,ch=cw*H/W;if(cw>iw){cw=iw;ch=cw*H/W}if(ch>ih){ch=ih;cw=ch*W/H}
  const px=d.x*iw,py=d.y*ih;const sx=clamp(px-cw/2,0,iw-cw),sy=clamp(py-ch/2,0,ih-ch);
  const c=canvas||document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingQuality='high';x.drawImage(img,sx,sy,cw,ch,0,0,W,H);
  const k=W/cw,r=W*.034;
  for(const o of others||[]){if(o.id===d.id||o.planId!==d.planId)continue;const ox=(o.x*iw-sx)*k,oy=(o.y*ih-sy)*k;if(ox<-r||oy<-r||ox>W+r||oy>H+3*r)continue;drawPin(x,ox,oy,r*.75,o.no,isFixed(o),.55)}
  const tx=(px-sx)*k,ty=(py-sy)*k;
  x.strokeStyle=isFixed(d)?COL.fixed:COL.open;x.lineWidth=W*.006;x.beginPath();x.arc(tx,ty,W*.045,0,Math.PI*2);x.stroke();
  drawPin(x,tx,ty,r,d.no??'?',isFixed(d));
  x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;x.strokeRect(1,1,W-2,H-2);
  return c;
}
function renderOverview(img,defects){
  const c=document.createElement('canvas');const iw=img.naturalWidth,ih=img.naturalHeight;c.width=iw;c.height=ih;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,iw,ih);x.drawImage(img,0,0);const r=Math.max(14,Math.max(iw,ih)*.011);
  for(const d of [...defects].sort((a,b)=>a.y-b.y))drawPin(x,d.x*iw,d.y*ih,r,d.no,isFixed(d));
  return c;
}

function loadScript(src){if(scriptP[src])return scriptP[src];const p=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scriptP[src];s.remove();rej(new Error('nie udało się pobrać potrzebnej biblioteki. Sprawdź połączenie z internetem'))};document.head.appendChild(s)});scriptP[src]=p;return p}

}

async function deleteProject(id){
  const [plans,defects,proj]=await Promise.all([dbAll('plans'),dbAll('defects'),dbGet('projects',id)]);
  for(const d of defects.filter(d=>d.projectId===id)){for(const b of [...d.before,...d.after])await delBlob(b);await dbDel('defects',d.id)}
  for(const pl of plans.filter(p=>p.projectId===id)){await delBlob(pl.imageId);await dbDel('plans',pl.id)}
  if(proj&&proj.logoId)await delBlob(proj.logoId);await dbDel('projects',id);
}

/* ---------- adding plans ---------- */
async function addPlan(project,file){
  if(!projectComplete(project)){toast('Najpierw uzupełnij dane inwestycji.');openProjectForm(project);return}
  if(!file)return;
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  let baseName=file.name.replace(/\.[^.]+$/,''),res;
  try{
    if(isPdf){
      busy('Wczytywanie pliku PDF…');const lib=await ensurePdfjs();
      const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;hideBusy();
      let n=1;if(pdf.numPages>1){n=await pickPdfPage(pdf);if(!n)return;baseName+=` – str. ${n}`}
      busy('Przygotowanie planu…');res=await renderPdfPage(pdf,n);pdf.destroy&&pdf.destroy();
    }else{busy('Przygotowanie planu…');const img=await fileToImage(file);res=await resizeImage(img,4000,.9)}
  }catch(e){hideBusy();toast('Nie udało się wczytać pliku: '+(e.message||e));return}
  hideBusy();
  const name=await dialog({title:'Nazwa planu',text:'Na przykład: Parter, Piętro 1, Garaż.',input:baseName,okLabel:'Zapisz plan'});if(name===null)return;
  const imageId=await putBlob(res.blob);const plan={id:uid(),projectId:project.id,name:name||baseName,imageId,w:res.w,h:res.h,createdAt:Date.now()};

async function renderPdfPage(pdf,n){
  const page=await pdf.getPage(n);const v1=page.getViewport({scale:1});let scale=3500/Math.max(v1.width,v1.height);
  const area=v1.width*v1.height*scale*scale;if(area>13e6)scale*=Math.sqrt(13e6/area);
  const vp=page.getViewport({scale});const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await page.render({canvasContext:ctx,viewport:vp}).promise;
  const blob=await canvasToBlob(c,'image/jpeg',.9);const out={blob,w:c.width,h:c.height};c.width=c.height=0;return out;
}
function pickPdfPage(pdf){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='sheet';
    el.innerHTML=`<header class="bar"><button class="iconbtn" data-x aria-label="Anuluj">${ICON.close}</button><h2 class="bar-t">Wybierz stronę z planem</h2></header><div class="wrap"><p class="muted" style="margin-top:0">Liczba stron w pliku: ${pdf.numPages}. Każdą stronę możesz dodać jako osobny plan.</p><div class="pages">${Array.from({length:pdf.numPages},(_,i)=>`<button class="pagebtn" data-p="${i+1}"><canvas></canvas>Strona ${i+1}</button>`).join('')}</div></div>`;
    document.body.appendChild(el);let alive=true;
    const done=v=>{alive=false;el.remove();res(v)};
    el.addEventListener('click',e=>{if(e.target.closest('[data-x]'))return done(null);const b=e.target.closest('[data-p]');if(b)done(+b.dataset.p)});
    (async()=>{for(const b of el.querySelectorAll('[data-p]')){if(!alive)return;try{const pg=await pdf.getPage(+b.dataset.p);const v=pg.getViewport({scale:1});const vp=pg.getViewport({scale:280/Math.max(v.width,v.height)});const c=b.querySelector('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}catch(e){}}})();
  });
}

async function renderPlan(planId,openDefectId,draft){

    <header class="vbar"><button class="iconbtn" id="vback" aria-label="Wróć do inwestycji">${ICON.back}</button><div class="vtitle"><span class="vt">${esc(plan.name)}</span><span class="vs">${esc(project.name)}</span></div><button class="btn small" id="vfit">Cały plan</button></header>
    <div class="viewer" id="viewer"><div class="stage" id="stage" style="width:${plan.w}px;height:${plan.h}px"><img id="vimg" alt="Plan ${esc(plan.name)}" draggable="false"><div class="pins" id="pins"></div></div></div>
    <footer class="vtools" id="vtools"></footer></div>`;
  document.getElementById('vimg').src=await blobURL(plan.imageId);
  PV={plan,project,defects:[],mode:'browse',onPlace:null};
  const viewer=document.getElementById('viewer'),stage=document.getElementById('stage'),pinsEl=document.getElementById('pins');
  let s=1,tx=0,ty=0,minS=.05,maxS=3,fitted=false;

  const fit=()=>{const r=viewer.getBoundingClientRect();if(!r.width||!r.height)return;const f=Math.min(r.width/plan.w,r.height/plan.h)*.94;s=f;minS=f*.6;maxS=Math.max(3,f*4);tx=(r.width-plan.w*s)/2;ty=(r.height-plan.h*s)/2;fitted=true;apply()};
  const focus=(x,y,zoom=5)=>{const r=viewer.getBoundingClientRect();const f=Math.min(r.width/plan.w,r.height/plan.h)*.94;s=clamp(f*zoom,minS,maxS);tx=r.width/2-x*plan.w*s;ty=r.height/2-y*plan.h*s+30;apply()};
  const zoomAt=(cx,cy,ns)=>{ns=clamp(ns,minS,maxS);const px=(cx-tx)/s,py=(cy-ty)/s;s=ns;tx=cx-px*s;ty=cy-py*s;apply()};

    else if(pts.size===2&&g){g.multi=true;const [a,b]=[...pts.values()];g.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;g.s0=s;g.m0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};g.tx0=tx;g.ty0=ty}});
  viewer.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!g)return;pts.set(e.pointerId,rel(e));
    if(pts.size>=2&&g.d0){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const ns=clamp(g.s0*d/g.d0,minS,maxS);const px=(g.m0.x-g.tx0)/g.s0,py=(g.m0.y-g.ty0)/g.s0;s=ns;tx=m.x-px*s;ty=m.y-py*s;apply()}
    else if(pts.size===1){const p=rel(e);const dx=p.x-g.sx,dy=p.y-g.sy;if(Math.hypot(dx,dy)>7)g.moved=true;if(g.moved){tx=g.tx0+dx;ty=g.ty0+dy;apply()}}});

    if(pts.size===0){const tap=!g.moved&&!g.multi&&Date.now()-g.t0<600&&e.type==='pointerup';const pin=g.pin;g=null;if(tap)onTap(p,pin)}};
  viewer.addEventListener('pointerup',up);viewer.addEventListener('pointercancel',up);
  viewer.addEventListener('wheel',e=>{e.preventDefault();const p=rel(e);zoomAt(p.x,p.y,s*Math.exp(-e.deltaY*.0015))},{passive:false});
  viewer.addEventListener('dblclick',e=>{const p=rel(e);zoomAt(p.x,p.y,s*2)});
  const onTap=(p,pinEl)=>{
    if(PV.mode==='browse'){if(pinEl)openDefect(pinEl.dataset.pin);return}

    else{tools.className='vtools mode';tools.innerHTML=`<div class="tape"></div><div class="mode-row"><div class="mode-t">${esc(text)}</div><button class="btn small" id="vcancel">Anuluj</button></div>`;
      document.getElementById('vcancel').onclick=()=>{setMode('browse');onCancel&&onCancel()}}};
  const reload=async()=>{PV.defects=(await dbAll('defects')).filter(d=>d.planId===planId);renderPins();if(PV.mode==='browse')setMode('browse')};
  const openDefect=id=>{const d=PV.defects.find(x=>x.id===id);if(d)openDefectForm({plan,project,defect:d})};
  document.getElementById('vback').onclick=()=>renderProject(project.id);
  document.getElementById('vfit').onclick=fit;
  const noGesture=e=>e.preventDefault();document.addEventListener('gesturestart',noGesture);
  Object.assign(PV,{reload,setMode,focus,fit,destroy(){ro.disconnect();document.removeEventListener('gesturestart',noGesture)}});

      }catch(err){hideBusy();toast('Nie udało się zapisać: '+(err.message||err));return}
      hideBusy();finish();await PV.reload();toast(isNew?`Dodano usterkę nr ${d.no}`:`Zapisano usterkę nr ${d.no}`);
    }
  });
}
async function checkDraft(){

    <button class="btn block" data-act="docx">Pobierz Word (.docx) do edycji</button>

  </div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';

    }catch(err){console.error(err);hideBusy();prog('');toast('Nie udało się utworzyć raportu: '+(err.message||err),5000)}

async function gatherReport(project,filter){
  const plans=(await dbAll('plans')).filter(p=>p.projectId===project.id).sort((a,b)=>a.createdAt-b.createdAt);
  let defects=(await dbAll('defects')).filter(d=>d.projectId===project.id).sort((a,b)=>a.no-b.no);
  if(filter==='open')defects=defects.filter(d=>!isFixed(d));if(filter==='fixed')defects=defects.filter(isFixed);
  return {plans:plans.filter(p=>defects.some(d=>d.planId===p.id)),planMap:new Map(plans.map(p=>[p.id,p])),defects};
}
async function blobData(blob){const bytes=new Uint8Array(await blob.arrayBuffer());const u=URL.createObjectURL(blob);try{const i=await loadImg(u);return {bytes,w:i.naturalWidth,h:i.naturalHeight,fmt:/png/i.test(blob.type)?'PNG':'JPEG'}}finally{URL.revokeObjectURL(u)}}

const fitBox=(w,h,bw,bh)=>{const k=Math.min(bw/w,bh/h);return {w:w*k,h:h*k}};
const PROJ_ROWS=p=>[['Nazwa inwestycji',p.name],['Adres inwestycji',p.address],['Inwestor',p.investor],['Wykonawca',p.contractor],['Data przeglądu',fmtDate(p.inspectionDate)],['Sporządził(a)',p.author]];
async function prepareDefect(d,data,prog,i){
  prog(`Przygotowanie usterki ${i+1} z ${data.defects.length}…`);
  const plan=data.planMap.get(d.planId);const img=await planImage(plan);
  const crop=await canvasData(renderCrop(img,d,data.defects,null,1200,900),.88);
  const before=[],after=[];for(const id of d.before){const b=await getBlob(id);if(b)before.push(await blobData(b))}for(const id of d.after){const b=await getBlob(id);if(b)after.push(await blobData(b))}
  return {plan,crop,before,after};
}

      s3.push(P(''));s3.push(new Table({width:{size:FULL,type:WidthType.DXA},columnWidths:[HALF,HALF],rows}))}
    else if(Rr.before.length){const rows=[new TableRow({tableHeader:true,children:[C([P(R('Zdjęcia usterki',{bold:true}))],FULL,{columnSpan:2,shading:{type:ShadingType.CLEAR,color:'auto',fill:'E8EBE6'}})]})];
      for(let r=0;r<Rr.before.length;r+=2)rows.push(new TableRow({cantSplit:true,children:[C(cellImg(Rr.before[r]),HALF,{verticalAlign:VerticalAlign.CENTER}),C(cellImg(Rr.before[r+1]),HALF,{verticalAlign:VerticalAlign.CENTER})]}));
      s3.push(P(''));s3.push(new Table({width:{size:FULL,type:WidthType.DXA},columnWidths:[HALF,HALF],rows}))}
    s3.push(P('',{spacing:{after:240}}));
  }
  s3.push(P(R('Podpisy'),{heading:HeadingLevel.HEADING_1,keepNext:true}));
  const sigCell=(l,n)=>C([P(R(l,{bold:true}),{keepNext:true}),P(R(n,grey),{keepNext:true}),P('',{spacing:{before:600},keepNext:true}),P(R('.................................................................'),{keepNext:true}),P(R('data i podpis',{size:16,...grey}))],HALF,{borders:NOB});
  s3.push(new Table({width:{size:FULL,type:WidthType.DXA},columnWidths:[HALF,HALF],rows:[new TableRow({cantSplit:true,children:[sigCell('Przedstawiciel Inwestora',p.investor),sigCell('Przedstawiciel Wykonawcy',p.contractor)]})]}));
  s3.push(P(R(`Sporządził(a): ${p.author}`,grey),{spacing:{before:240}}));
  sections.push({properties:page(PageOrientation.PORTRAIT),footers:{default:footer},children:s3});
  const doc=new Document({creator:p.author,title:`Protokół usterek – ${p.name}`,
    styles:{default:{document:{run:{font:'Calibri',size:21}}},paragraphStyles:[
      {id:'Title',name:'Title',basedOn:'Normal',next:'Normal',quickFormat:true,run:{size:44,bold:true,color:'17202B'},paragraph:{spacing:{after:120}}},
      {id:'Heading1',name:'Heading 1',basedOn:'Normal',next:'Normal',quickFormat:true,run:{size:30,bold:true,color:'17202B'},paragraph:{spacing:{before:360,after:120},keepNext:true}},
      {id:'Heading2',name:'Heading 2',basedOn:'Normal',next:'Normal',quickFormat:true,run:{size:26,bold:true,color:'17202B'},paragraph:{spacing:{before:240,after:100},keepNext:true}}]},
    sections});
  prog('Zapisywanie pliku…');return await Packer.toBlob(doc);
}

/* ---------- backup ---------- */
function b64FromBuf(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function bufFromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function exportBackup(){
  busy('Przygotowanie kopii…');
  try{const [projects,plans,defects,blobs]=await Promise.all(['projects','plans','defects','blobs'].map(dbAll));
    const json=JSON.stringify({app:'usterki-na-planie',version:1,created:new Date().toISOString(),projects,plans,defects,blobs:blobs.map(b=>({id:b.id,type:b.type,b64:b64FromBuf(b.buf)}))});
    hideBusy();await saveFile(`Usterki_kopia_${todayISO()}.json`,new Blob([json],{type:'application/json'}));
  }catch(e){hideBusy();toast('Nie udało się przygotować kopii: '+(e.message||e))}
}
async function importBackup(f){
  if(!f)return;
  busy('Wczytywanie kopii…');let data;
  try{data=JSON.parse(await f.text());if(data.app!=='usterki-na-planie')throw new Error('to nie jest plik kopii tej aplikacji')}catch(e){hideBusy();toast('Nie można wczytać pliku: '+e.message);return}
  hideBusy();
  const ok=await dialog({title:'Wczytać kopię?',text:`Plik zawiera inwestycje: ${data.projects.length}. Inwestycje z kopii zastąpią te same inwestycje w telefonie, pozostałe zostaną bez zmian.`,okLabel:'Wczytaj'});if(!ok)return;
  busy('Wczytywanie kopii…');
  try{for(const b of data.blobs)await dbPut('blobs',{id:b.id,type:b.type,buf:bufFromB64(b.b64)});for(const s of ['projects','plans','defects'])for(const r of data[s])await dbPut(s,r);hideBusy();renderHome();toast('Kopia wczytana')}
  catch(e){hideBusy();toast('Błąd wczytywania: '+(e.message||e))}
}

/* ---------- sign-in and SharePoint: DEMO MODE ----------
   Both are placeholders. Production: replace AUTH with MSAL.js (Entra ID, single tenant,
   assignment required) and SP.upload with a Microsoft Graph upload to the SharePoint library. */
const DEFAULT_SETTINGS={id:'settings',domain:'',spSite:'',spLibrary:'',spFolder:'Usterki/{inwestycja}'};
async function getSettings(){return {...DEFAULT_SETTINGS,...((await dbGet('meta','settings'))||{})}}
const AUTH={
  demo:true,
  session:()=>dbGet('meta','session'),
  async signIn(email){await dbPut('meta',{id:'session',email,at:Date.now()})},
  async signOut(){await dbDel('meta','session')}
};
const SP={
  demo:true,
  configured:s=>!!(s.spSite&&s.spLibrary),
  target(s,projectName,filename){const folder=(s.spFolder||'').replace(/\{inwestycja\}/gi,String(projectName).replace(/[\\/:*?"<>|#%]+/g,' ').trim()).replace(/^\/+|\/+$/g,'');
    return [s.spSite.replace(/\/+$/,''),s.spLibrary.replace(/^\/+|\/+$/g,''),folder,filename].filter(Boolean).join('/')},
  async upload(path,blob){await new Promise(r=>setTimeout(r,500));return {demo:true,path}}
};
const normDomain=v=>String(v||'').trim().toLowerCase().replace(/^.*@/,'').replace(/^https?:\/\//,'').replace(/\/.*$/,'');
const DEMO_NOTE='<div class="demo">Tryb demonstracyjny. Logowanie nie jest jeszcze połączone z kontem Microsoft firmy, więc nie chroni dostępu do danych.</div>';

async function renderLogin(){
  closeViewer();
  const st=await getSettings();
  app.innerHTML=`<header class="bar"><span class="brand">Usterki na planie</span></header>
  <main class="wrap">${DEMO_NOTE}
    <h1 class="h1">Zaloguj się</h1><p class="muted" style="margin-top:0">Użyj służbowego adresu e-mail w domenie firmy.</p>
    ${st.domain?'':`<label class="field"><span class="lbl">Domena firmy <span class="req">*</span></span><input class="inp" id="ldomain" placeholder="np. firma.pl" autocapitalize="off" autocomplete="off" spellcheck="false"></label>`}
    <label class="field"><span class="lbl">Służbowy adres e-mail <span class="req">*</span></span><input class="inp" id="lemail" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="imie.nazwisko@${esc(st.domain||'firma.pl')}"></label>
    <p class="formerr" id="lerr" hidden></p>
    <button class="btn primary block" id="lgo">Zaloguj</button>
    ${st.domain?`<p class="muted small">Dostęp tylko dla adresów w domenie ${esc(st.domain)}. Domenę zmienisz w ustawieniach po zalogowaniu.</p>`:'<p class="muted small">Domenę podajesz raz. Później logują się tylko adresy z tej domeny.</p>'}
  </main>`;
  const err=t=>{const e=document.getElementById('lerr');e.hidden=!t;e.textContent=t||''};
  const go=async()=>{
    let domain=st.domain;
    if(!domain){domain=normDomain(document.getElementById('ldomain').value);if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(domain))return err('Wpisz poprawną domenę firmy, np. firma.pl.')}
    const email=document.getElementById('lemail').value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+$/.test(email))return err('Wpisz poprawny adres e-mail.');
    if(!email.endsWith('@'+domain))return err(`Dostęp mają tylko adresy w domenie ${domain}.`);
    if(!st.domain)await dbPut('meta',{...st,domain});
    await AUTH.signIn(email);await renderHome();toast('Zalogowano: '+email);checkDraft();
  };
  document.getElementById('lgo').onclick=go;
  document.getElementById('lemail').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

async function openSettings(){
  const st=await getSettings();const sess=await AUTH.session();
  const el=document.createElement('div');el.className='sheet';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<header class="bar"><button class="iconbtn" data-act="close" aria-label="Zamknij">${ICON.close}</button><h2 class="bar-t">Ustawienia</h2><button class="btn primary small" data-act="save">Zapisz</button></header>
  <div class="wrap">${DEMO_NOTE}
    <h2 class="h2" style="margin-top:0">Logowanie</h2>
    <label class="field"><span class="lbl">Domena firmy <span class="req">*</span></span><input class="inp" data-s="domain" value="${esc(st.domain)}" autocapitalize="off" spellcheck="false" placeholder="firma.pl"><div class="ferr" hidden></div></label>
    <h2 class="h2">SharePoint</h2>
    <p class="muted small" style="margin-top:0">Tu trafią kopie raportów. Na razie zapis jest symulowany.</p>
    <label class="field"><span class="lbl">Adres witryny</span><input class="inp" data-s="spSite" type="url" value="${esc(st.spSite)}" autocapitalize="off" spellcheck="false" placeholder="https://firma.sharepoint.com/sites/Odbiory"><div class="ferr" hidden></div></label>
    <label class="field"><span class="lbl">Biblioteka dokumentów</span><input class="inp" data-s="spLibrary" value="${esc(st.spLibrary)}" placeholder="Dokumenty"></label>
    <label class="field"><span class="lbl">Folder</span><input class="inp" data-s="spFolder" value="${esc(st.spFolder)}" autocapitalize="off" spellcheck="false"><span class="muted small">{inwestycja} zostanie zastąpione nazwą inwestycji.</span></label>
    <p class="muted small" id="spprev"></p>
    <button class="btn primary block" data-act="save">Zapisz ustawienia</button>
  </div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  const read=()=>{const v={...st};el.querySelectorAll('[data-s]').forEach(i=>v[i.dataset.s]=i.value.trim());v.domain=normDomain(v.domain);return v};
  const prev=()=>{const v=read();el.querySelector('#spprev').textContent=SP.configured(v)?'Przykładowa ścieżka: '+SP.target(v,'Inwestycja A','Protokol_usterek.pdf'):'Uzupełnij adres witryny i bibliotekę, aby zapisywać raporty w SharePoint.'};
  prev();el.addEventListener('input',prev);
  const close=()=>{el.remove();document.body.style.overflow=''};
  el.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='close')return close();
    const v=read();const dIn=el.querySelector('[data-s="domain"]'),sIn=el.querySelector('[data-s="spSite"]');
    const dBad=!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(v.domain),sBad=!!v.spSite&&!/^https:\/\/[^\s/]+\.sharepoint\.com\/sites\/[^\s]+$/i.test(v.spSite);
    dIn.classList.toggle('bad',dBad);dIn.nextElementSibling.hidden=!dBad;dIn.nextElementSibling.textContent='Wpisz poprawną domenę, np. firma.pl';
    sIn.classList.toggle('bad',sBad);sIn.nextElementSibling.hidden=!sBad;sIn.nextElementSibling.textContent='Adres powinien wyglądać tak: https://firma.sharepoint.com/sites/nazwa';
    if(dBad||sBad)return;
    await dbPut('meta',v);close();
    if(sess&&!sess.email.endsWith('@'+v.domain)){await AUTH.signOut();renderLogin();toast('Zmieniono domenę. Zaloguj się adresem z nowej domeny.')}else{renderHome();toast('Zapisano ustawienia')}
  });
}

/* ---------- start ---------- */
(async()=>{
  try{await openDB();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
  catch(e){app.innerHTML=`<main class="wrap"><h1 class="h1">Brak dostępu do pamięci</h1><p>Przeglądarka nie pozwala zapisywać danych (np. w trybie prywatnym). Otwórz aplikację w zwykłym oknie przeglądarki.</p></main>`;return}
  if(!(await AUTH.session()))return renderLogin();
  await renderHome();checkDraft();
  setTimeout(()=>{loadScript(LIB.jspdf).catch(()=>{});loadScript(LIB.docx).catch(()=>{});ensurePdfjs().catch(()=>{})},4000);
})();
</script>

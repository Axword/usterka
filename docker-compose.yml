# Całość jedną komendą:  docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:8000/api/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: usterka
      POSTGRES_USER: usterka
      POSTGRES_PASSWORD: usterka
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usterka"]
      interval: 3s
      retries: 20

  backend:
    build: ./application
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://usterka:usterka@db:5432/usterka
      MEDIA_ROOT: /data/media
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes: [media:/data/media]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./usterka_frontend
      args: { VITE_API_BASE_URL: "http://localhost:8000/api/" }
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
  media:
